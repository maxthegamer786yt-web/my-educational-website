<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Typer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; user-select: none; }
    body {
      background: #090d16;
      color: #38bdf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .wrapper {
      background: #030712;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      width: 480px;
      padding: 24px;
      text-align: center;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 16px;
      font-weight: bold;
      color: #94a3b8;
    }
    .stats span { color: #38bdf8; }
    .word-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .target-word {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #f8fafc;
    }
    input {
      width: 100%;
      background: #020617;
      border: 2px solid #38bdf8;
      border-radius: 6px;
      padding: 12px;
      font-size: 20px;
      font-family: inherit;
      color: #38bdf8;
      text-align: center;
      outline: none;
    }
    input:focus {
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .overlay {
      margin-top: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      border-radius: 4px;
      font-family: inherit;
    }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="stats">
      <div>TIME: <span id="time">30</span>s</div>
      <div>WPM: <span id="wpm">0</span></div>
      <div>SCORE: <span id="score">0</span></div>
    </div>

    <div class="word-box">
      <div class="target-word" id="word">READY?</div>
    </div>

    <input type="text" id="input" placeholder="Type the word and press Space..." autocomplete="off" autofocus>

    <div class="overlay" id="end-box">
      <h3 style="color: #f43f5e; font-size: 24px;">TIME UP!</h3>
      <p style="color: #cbd5e1;">Final Score: <span id="final-score" style="color: #38bdf8; font-weight: bold;">0</span></p>
      <button class="btn" id="restart">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const WORDS = [
      'arcade', 'matrix', 'cyber', 'laser', 'vector', 'plasma', 'rocket',
      'quantum', 'nexus', 'blaster', 'glitch', 'pixel', 'hyper', 'shield',
      'turbo', 'shadow', 'speed', 'retro', 'binary', 'portal', 'engine',
      'orbit', 'pulsar', 'comet', 'falcon', 'nebula', 'module', 'system'
    ];

    const timeEl = document.getElementById('time');
    const wpmEl = document.getElementById('wpm');
    const scoreEl = document.getElementById('score');
    const wordEl = document.getElementById('word');
    const input = document.getElementById('input');
    const endBox = document.getElementById('end-box');
    const finalScore = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart');

    let currentWord = '';
    let score = 0;
    let wordsCount = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let gameActive = false;

    // Web Audio FX
    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function clickSound(freq = 600) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    function nextWord() {
      currentWord = WORDS[Math.floor(Math.random() * WORDS.length)];
      wordEl.textContent = currentWord;
    }

    function startGame() {
      score = 0;
      wordsCount = 0;
      timeLeft = 30;
      gameActive = true;
      scoreEl.textContent = '0';
      wpmEl.textContent = '0';
      timeEl.textContent = '30';
      endBox.style.display = 'none';
      input.value = '';
      input.disabled = false;
      input.focus();
      nextWord();

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;
        const elapsedMin = (30 - timeLeft) / 60;
        if (elapsedMin > 0) {
          wpmEl.textContent = Math.round(wordsCount / elapsedMin);
        }
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      input.disabled = true;
      finalScore.textContent = score;
      endBox.style.display = 'flex';
    }

    input.addEventListener('input', () => {
      if (!gameActive) {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        startGame();
        return;
      }

      clickSound(400);
      const val = input.value.trim().toLowerCase();
      if (val === currentWord) {
        clickSound(880);
        score += currentWord.length * 10;
        wordsCount++;
        scoreEl.textContent = score;
        input.value = '';
        nextWord();
      }
    });

    restartBtn.onclick = () => {
      startGame();
    };

    nextWord();
  </script>
</body>
</html>
