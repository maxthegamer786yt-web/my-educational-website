<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Flight</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      background: #0284c7;
      border: 3px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
      cursor: pointer;
    }
    canvas {
      display: block;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 380px;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: bold;
    }
    .hud span { color: #38bdf8; }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 20px;
    }
    .overlay h2 {
      font-size: 28px;
      color: #fde047;
      text-shadow: 0 0 10px rgba(253, 224, 71, 0.5);
    }
    .btn {
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #fef08a; transform: scale(1.05); }
    .hint {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score-val">0</span></div>
    <div>BEST: <span id="high-val">0</span></div>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="380" height="520"></canvas>
    <div id="start-overlay" class="overlay">
      <h2>FLAPPY FLIGHT</h2>
      <p style="color: #cbd5e1; font-size: 13px;">Click or press Space to flap wings. Avoid obstacles!</p>
      <button class="btn" id="start-btn">FLAP OFF</button>
    </div>
    <div id="gameover-overlay" class="overlay" style="display: none;">
      <h2 style="color: #f43f5e;">CRASHED!</h2>
      <p style="color: #cbd5e1; font-size: 15px;">Score: <span id="final-score" style="color: #fde047; font-weight: bold;">0</span></p>
      <button class="btn" id="restart-btn">FLY AGAIN</button>
    </div>
  </div>

  <div class="hint">Controls: Click, Tap, or Press Space to Flap</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const highVal = document.getElementById('high-val');
    const finalScore = document.getElementById('final-score');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const gameContainer = document.getElementById('game-container');

    let highScore = parseInt(localStorage.getItem('flappy_highscore') || '0', 10);
    highVal.textContent = highScore;

    // Web Audio
    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function flapSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }
    function pointSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    const bird = {
      x: 60,
      y: 200,
      w: 26,
      h: 22,
      vy: 0,
      gravity: 0.38,
      jump: -6.5,
      rotation: 0
    };

    let pipes = [];
    let clouds = [
      { x: 50, y: 80, s: 0.4 },
      { x: 220, y: 130, s: 0.6 },
      { x: 340, y: 60, s: 0.5 }
    ];
    let score = 0;
    let isRunning = false;
    let frames = 0;

    function initGame() {
      bird.y = 200;
      bird.vy = 0;
      bird.rotation = 0;
      pipes = [];
      score = 0;
      scoreVal.textContent = score;
      frames = 0;
      startOverlay.style.display = 'none';
      gameoverOverlay.style.display = 'none';
      isRunning = true;
      requestAnimationFrame(loop);
    }

    function flap() {
      if (!isRunning) return;
      bird.vy = bird.jump;
      flapSound();
    }

    function gameOver() {
      isRunning = false;
      finalScore.textContent = score;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappy_highscore', highScore);
        highVal.textContent = highScore;
      }
      gameoverOverlay.style.display = 'flex';
    }

    function loop() {
      if (!isRunning) return;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function update() {
      frames++;

      // Clouds
      clouds.forEach(c => {
        c.x -= c.s;
        if (c.x < -60) c.x = canvas.width + 40;
      });

      // Bird physics
      bird.vy += bird.gravity;
      bird.y += bird.vy;
      bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.08));

      // Floor / ceiling collision
      if (bird.y + bird.h >= canvas.height - 40 || bird.y <= 0) {
        return gameOver();
      }

      // Pipe spawn
      if (frames % 100 === 0) {
        const gap = 135;
        const topH = Math.floor(Math.random() * (canvas.height - gap - 160)) + 40;
        pipes.push({
          x: canvas.width,
          topH: topH,
          bottomY: topH + gap,
          w: 52,
          passed: false
        });
      }

      // Pipe update & collision
      pipes.forEach(p => {
        p.x -= 2.2;

        // Score
        if (!p.passed && p.x + p.w < bird.x) {
          p.passed = true;
          score++;
          scoreVal.textContent = score;
          pointSound();
        }

        // Collision
        if (bird.x + bird.w > p.x && bird.x < p.x + p.w) {
          if (bird.y < p.topH || bird.y + bird.h > p.bottomY) {
            gameOver();
          }
        }
      });

      pipes = pipes.filter(p => p.x + p.w > -10);
    }

    function draw() {
      // Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#0284c7');
      skyGrad.addColorStop(0.7, '#38bdf8');
      skyGrad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 20, 0, Math.PI * 2);
        ctx.arc(c.x + 18, c.y - 6, 24, 0, Math.PI * 2);
        ctx.arc(c.x + 36, c.y, 18, 0, Math.PI * 2);
        ctx.fill();
      });

      // Pipes
      pipes.forEach(p => {
        ctx.fillStyle = '#22c55e';
        ctx.strokeStyle = '#15803d';
        ctx.lineWidth = 3;

        // Top pipe
        ctx.fillRect(p.x, 0, p.w, p.topH);
        ctx.strokeRect(p.x, -3, p.w, p.topH + 3);
        // Top cap
        ctx.fillRect(p.x - 4, p.topH - 20, p.w + 8, 20);
        ctx.strokeRect(p.x - 4, p.topH - 20, p.w + 8, 20);

        // Bottom pipe
        const botH = canvas.height - p.bottomY;
        ctx.fillRect(p.x, p.bottomY, p.w, botH);
        ctx.strokeRect(p.x, p.bottomY, p.w, botH + 3);
        // Bottom cap
        ctx.fillRect(p.x - 4, p.bottomY, p.w + 8, 20);
        ctx.strokeRect(p.x - 4, p.bottomY, p.w + 8, 20);
      });

      // Ground
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 10);
      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

      // Bird
      ctx.save();
      ctx.translate(bird.x + bird.w / 2, bird.y + bird.h / 2);
      ctx.rotate(bird.rotation);

      // Body
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, 0, bird.w / 2, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(6, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(7, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(17, 3);
      ctx.lineTo(10, 6);
      ctx.closePath();
      ctx.fill();

      // Wing
      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.arc(-5, 2, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    gameContainer.onclick = flap;
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    startBtn.onclick = (e) => {
      e.stopPropagation();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      initGame();
    };
    restartBtn.onclick = (e) => {
      e.stopPropagation();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      initGame();
    };

    draw();
  </script>
</body>
</html>
