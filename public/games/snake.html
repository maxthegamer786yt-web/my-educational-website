<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      background: #0f172a;
      border: 3px solid #10b981;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);
      border-radius: 8px;
    }
    canvas {
      display: block;
      background: #020617;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
      padding: 0 8px;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .hud span { color: #10b981; }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
    }
    .overlay h2 {
      font-size: 32px;
      color: #34d399;
      text-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
    }
    .btn {
      background: #10b981;
      color: #020617;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #34d399;
      transform: scale(1.05);
    }
    .hint {
      color: #64748b;
      font-size: 12px;
      margin-top: 12px;
    }
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-gap: 6px;
      margin-top: 12px;
    }
    .d-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      height: 48px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .d-btn:active { background: #10b981; color: #000; }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score-val">0</span></div>
    <div>BEST: <span id="high-val">0</span></div>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="480" height="480"></canvas>
    <div id="start-overlay" class="overlay">
      <h2>RETRO SNAKE</h2>
      <p style="color: #94a3b8; max-width: 280px; font-size: 13px;">Eat the glowing orbs. Don't crash into walls or your own tail!</p>
      <button class="btn" id="start-btn">START GAME</button>
    </div>
    <div id="gameover-overlay" class="overlay" style="display: none;">
      <h2 style="color: #f43f5e;">GAME OVER</h2>
      <p style="color: #cbd5e1; font-size: 16px;">Final Score: <span id="final-score" style="color: #34d399; font-weight: bold;">0</span></p>
      <button class="btn" id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <div class="hint">Controls: Arrow Keys or WASD · Space to Pause</div>

  <div class="d-pad">
    <div></div>
    <button class="d-btn" id="btn-up">▲</button>
    <div></div>
    <button class="d-btn" id="btn-left">◀</button>
    <button class="d-btn" id="btn-down">▼</button>
    <button class="d-btn" id="btn-right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const highVal = document.getElementById('high-val');
    const finalScore = document.getElementById('final-score');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake = [];
    let food = { x: 0, y: 0 };
    let goldenFood = null;
    let goldenTimer = 0;
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_highscore') || '0', 10);
    highVal.textContent = highScore;
    let gameLoop = null;
    let isRunning = false;
    let isPaused = false;

    // Web Audio Sound FX
    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function beep(freq, duration, type = 'square') {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initGame() {
      snake = [
        { x: 10, y: 12 },
        { x: 9, y: 12 },
        { x: 8, y: 12 },
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreVal.textContent = score;
      goldenFood = null;
      spawnFood();
      startOverlay.style.display = 'none';
      gameoverOverlay.style.display = 'none';
      isRunning = true;
      isPaused = false;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 90);
    }

    function spawnFood() {
      while (true) {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
        const collide = snake.some(s => s.x === food.x && s.y === food.y);
        if (!collide) break;
      }
      // Chance of golden food
      if (Math.random() < 0.25 && !goldenFood) {
        goldenFood = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
        goldenTimer = 60;
      }
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      beep(150, 0.4, 'sawtooth');
      finalScore.textContent = score;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_highscore', highScore);
        highVal.textContent = highScore;
      }
      gameoverOverlay.style.display = 'flex';
    }

    function update() {
      if (!isRunning || isPaused) return;

      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return gameOver();
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreVal.textContent = score;
        beep(540, 0.08);
        spawnFood();
      } else if (goldenFood && head.x === goldenFood.x && head.y === goldenFood.y) {
        score += 35;
        scoreVal.textContent = score;
        goldenFood = null;
        beep(880, 0.15);
      } else {
        snake.pop();
      }

      if (goldenFood) {
        goldenTimer--;
        if (goldenTimer <= 0) goldenFood = null;
      }

      draw();
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }
      for (let j = 0; j <= canvas.height; j += GRID) {
        ctx.beginPath();
        ctx.moveTo(0, j);
        ctx.lineTo(canvas.width, j);
        ctx.stroke();
      }

      // Draw regular food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw golden food
      if (goldenFood) {
        ctx.fillStyle = '#fbbf24';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(goldenFood.x * GRID + GRID / 2, goldenFood.y * GRID + GRID / 2, GRID / 2 - 1, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw snake
      snake.forEach((part, index) => {
        if (index === 0) {
          ctx.fillStyle = '#34d399';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 12;
        } else {
          ctx.fillStyle = '#059669';
          ctx.shadowBlur = 4;
        }
        ctx.fillRect(part.x * GRID + 1, part.y * GRID + 1, GRID - 2, GRID - 2);
      });

      ctx.shadowBlur = 0;
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code) && dir.y === 0) nextDir = { x: 0, y: -1 };
      else if (['ArrowDown', 'KeyS'].includes(e.code) && dir.y === 0) nextDir = { x: 0, y: 1 };
      else if (['ArrowLeft', 'KeyA'].includes(e.code) && dir.x === 0) nextDir = { x: -1, y: 0 };
      else if (['ArrowRight', 'KeyD'].includes(e.code) && dir.x === 0) nextDir = { x: 1, y: 0 };
      else if (e.code === 'Space') {
        if (isRunning) isPaused = !isPaused;
      }
    });

    document.getElementById('btn-up').onclick = () => { if (dir.y === 0) nextDir = { x: 0, y: -1 }; };
    document.getElementById('btn-down').onclick = () => { if (dir.y === 0) nextDir = { x: 0, y: 1 }; };
    document.getElementById('btn-left').onclick = () => { if (dir.x === 0) nextDir = { x: -1, y: 0 }; };
    document.getElementById('btn-right').onclick = () => { if (dir.x === 0) nextDir = { x: 1, y: 0 }; };

    startBtn.onclick = () => {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      initGame();
    };
    restartBtn.onclick = () => {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      initGame();
    };

    draw();
  </script>
</body>
</html>
