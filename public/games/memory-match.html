<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #090d16;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 360px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
    }
    .hud span { color: #a855f7; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 76px);
      grid-gap: 12px;
      perspective: 800px;
    }
    .card {
      width: 76px;
      height: 76px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.25s ease;
      cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card.matched { transform: rotateY(180deg) scale(0.96); opacity: 0.65; cursor: default; }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 28px;
    }
    .card-front {
      background: #1e293b;
      border: 2px solid #334155;
      color: #a855f7;
    }
    .card-front:hover {
      border-color: #a855f7;
      background: #243248;
    }
    .card-back {
      background: #0f172a;
      border: 2px solid #a855f7;
      transform: rotateY(180deg);
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.4);
    }
    .restart-btn {
      margin-top: 18px;
      background: #a855f7;
      color: #ffffff;
      border: none;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .restart-btn:hover { background: #c084fc; }
  </style>
</head>
<body>
  <div class="hud">
    <div>MOVES: <span id="moves">0</span></div>
    <div>MATCHES: <span id="matches">0/8</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <button class="restart-btn" id="restart">Shuffle & Restart</button>

  <script>
    const emojis = ['🚀', '👾', '🕹️', '⚡', '💎', '🔥', '⭐', '🎯'];
    const gridEl = document.getElementById('moves');
    const movesEl = document.getElementById('moves');
    const matchesEl = document.getElementById('matches');
    const grid = document.getElementById('grid');
    const restartBtn = document.getElementById('restart');

    let deck = [];
    let flippedCards = [];
    let moves = 0;
    let matches = 0;
    let lockBoard = false;

    // Web Audio FX
    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playChime(freq) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    function init() {
      moves = 0;
      matches = 0;
      movesEl.textContent = moves;
      matchesEl.textContent = '0/8';
      flippedCards = [];
      lockBoard = false;
      deck = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
      grid.innerHTML = '';

      deck.forEach((icon, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index;
        card.dataset.icon = icon;

        card.innerHTML = `
          <div class="card-face card-front">✦</div>
          <div class="card-face card-back">${icon}</div>
        `;

        card.onclick = () => flipCard(card);
        grid.appendChild(card);
      });
    }

    function flipCard(card) {
      if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      playChime(420);
      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        movesEl.textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [c1, c2] = flippedCards;
      const isMatch = c1.dataset.icon === c2.dataset.icon;

      if (isMatch) {
        playChime(680);
        setTimeout(() => playChime(880), 80);
        c1.classList.add('matched');
        c2.classList.add('matched');
        matches++;
        matchesEl.textContent = `${matches}/8`;
        flippedCards = [];
      } else {
        lockBoard = true;
        setTimeout(() => {
          c1.classList.remove('flipped');
          c2.classList.remove('flipped');
          flippedCards = [];
          lockBoard = false;
        }, 800);
      }
    }

    restartBtn.onclick = init;
    init();
  </script>
</body>
</html>
