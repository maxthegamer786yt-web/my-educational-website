<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020617;
      color: #38bdf8;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      background: #030712;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      border-radius: 8px;
    }
    canvas { display: block; }
    .hud {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 540px;
      margin-bottom: 12px;
      font-size: 20px;
      font-weight: 900;
    }
    .hud span { color: #f8fafc; }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 7, 18, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
    }
    .btn {
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .btn:hover { background: #7dd3fc; transform: scale(1.05); }
    .hint {
      color: #64748b;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>PLAYER: <span id="p-score">0</span></div>
    <div>CPU: <span id="c-score">0</span></div>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="540" height="380"></canvas>
    <div id="start-overlay" class="overlay">
      <h2 style="font-size: 32px; color: #38bdf8;">CYBER PONG</h2>
      <p style="color: #94a3b8; font-size: 13px;">First to 7 points wins the match! Move paddle with Mouse or W/S.</p>
      <button class="btn" id="start-btn">SERVE BALL</button>
    </div>
    <div id="gameover-overlay" class="overlay" style="display: none;">
      <h2 id="end-title" style="font-size: 32px;">VICTORY</h2>
      <button class="btn" id="restart-btn">REMATCH</button>
    </div>
  </div>

  <div class="hint">Controls: Move Mouse or W/S or Up/Down Arrows</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const pScoreEl = document.getElementById('p-score');
    const cScoreEl = document.getElementById('c-score');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const endTitle = document.getElementById('end-title');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let isRunning = false;
    let pScore = 0;
    let cScore = 0;

    const paddleW = 12;
    const paddleH = 70;
    const player = { x: 20, y: 155, vy: 0 };
    const cpu = { x: canvas.width - 32, y: 155, speed: 4.2 };
    const ball = { x: 270, y: 190, r: 6, vx: 5, vy: 2 };

    // Web Audio FX
    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function pongBeep(freq) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = 4.5 * direction;
      ball.vy = (Math.random() - 0.5) * 6;
    }

    function initGame() {
      pScore = 0;
      cScore = 0;
      pScoreEl.textContent = pScore;
      cScoreEl.textContent = cScore;
      resetBall(Math.random() > 0.5 ? 1 : -1);
      startOverlay.style.display = 'none';
      gameoverOverlay.style.display = 'none';
      isRunning = true;
      requestAnimationFrame(loop);
    }

    function loop() {
      if (!isRunning) return;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Keyboard & Mouse controls
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const my = e.clientY - rect.top;
      player.y = Math.max(0, Math.min(canvas.height - paddleH, my - paddleH / 2));
    });

    function update() {
      if (keys['ArrowUp'] || keys['KeyW']) player.y = Math.max(0, player.y - 6);
      if (keys['ArrowDown'] || keys['KeyS']) player.y = Math.min(canvas.height - paddleH, player.y + 6);

      // CPU AI
      const cpuCenter = cpu.y + paddleH / 2;
      if (cpuCenter < ball.y - 12) cpu.y += cpu.speed;
      else if (cpuCenter > ball.y + 12) cpu.y -= cpu.speed;
      cpu.y = Math.max(0, Math.min(canvas.height - paddleH, cpu.y));

      // Ball physics
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top/bottom bounce
      if (ball.y - ball.r < 0 || ball.y + ball.r > canvas.height) {
        ball.vy = -ball.vy;
        pongBeep(280);
      }

      // Player paddle collision
      if (
        ball.x - ball.r <= player.x + paddleW &&
        ball.x + ball.r >= player.x &&
        ball.y >= player.y &&
        ball.y <= player.y + paddleH
      ) {
        const offset = (ball.y - (player.y + paddleH / 2)) / (paddleH / 2);
        ball.vx = Math.abs(ball.vx) * 1.05;
        ball.vy = offset * 6;
        pongBeep(480);
      }

      // CPU paddle collision
      if (
        ball.x + ball.r >= cpu.x &&
        ball.x - ball.r <= cpu.x + paddleW &&
        ball.y >= cpu.y &&
        ball.y <= cpu.y + paddleH
      ) {
        const offset = (ball.y - (cpu.y + paddleH / 2)) / (paddleH / 2);
        ball.vx = -Math.abs(ball.vx) * 1.05;
        ball.vy = offset * 6;
        pongBeep(420);
      }

      // Score points
      if (ball.x < 0) {
        cScore++;
        cScoreEl.textContent = cScore;
        pongBeep(180);
        checkWinner();
        resetBall(1);
      } else if (ball.x > canvas.width) {
        pScore++;
        pScoreEl.textContent = pScore;
        pongBeep(640);
        checkWinner();
        resetBall(-1);
      }
    }

    function checkWinner() {
      if (pScore >= 7 || cScore >= 7) {
        isRunning = false;
        endTitle.textContent = pScore >= 7 ? 'YOU WIN!' : 'CPU WINS!';
        endTitle.style.color = pScore >= 7 ? '#34d399' : '#f43f5e';
        gameoverOverlay.style.display = 'flex';
      }
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center divider
      ctx.strokeStyle = '#1e293b';
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Player paddle
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#0284c7';
      ctx.shadowBlur = 8;
      ctx.fillRect(player.x, player.y, paddleW, paddleH);

      // CPU paddle
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#e11d48';
      ctx.shadowBlur = 8;
      ctx.fillRect(cpu.x, cpu.y, paddleW, paddleH);

      // Ball
      ctx.fillStyle = '#f8fafc';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
    }

    startBtn.onclick = () => {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      initGame();
    };
    restartBtn.onclick = () => {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      initGame();
    };

    draw();
  </script>
</body>
</html>
